<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171327">
<title>MyPage — Ton univers</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#211b32;--muted:#79738b;--line:#e8e3f1;--purple:#7545d6;--pale:#eee7ff;--pink:#e84c91;--shadow:0 8px 28px #2514460b;--soft:#f7f5fb;--navbg:#fffefaed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;transition:background .2s,color .2s}body.dark{--bg:#11101a;--card:#1c1928;--ink:#f2eefb;--muted:#aaa2bd;--line:#393247;--pale:#34274f;--shadow:0 8px 28px #00000020;--soft:#272235;--navbg:#1b1826ed}body.dark .search input{color:#fff}body.dark .composer input,body.dark .field,body.dark .textarea{background:#272235;color:var(--ink);border-color:var(--line)}body.dark .comment-list{background:#272235}body.dark .storyring span{border-color:#1c1928;background:#34274f;color:#d9c8ff}body.dark .bottom{background:var(--navbg)}body.dark .chip{background:var(--card);border-color:var(--line);color:var(--muted)}body.dark .chip.active{background:var(--pale);color:#d5c2ff}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}.top{background:#171327;color:white;padding:20px 17px 17px;position:sticky;top:0;z-index:3;box-shadow:0 5px 22px #17132720}.brand{display:flex;align-items:center;gap:11px}.logo{height:44px;width:44px;border-radius:15px;background:linear-gradient(135deg,#a78bfa,#7040d5);display:grid;place-items:center;font-size:25px;font-weight:900}.brand h1{font-size:24px;margin:0;letter-spacing:-.8px}.tagline{font-size:12px;color:#c9b9f7;margin-top:2px}.search{margin-top:15px;display:flex;gap:9px;align-items:center;background:#302744;border-radius:13px;padding:0 12px}.search input{background:transparent;border:0;outline:0;color:white;padding:12px 0;width:100%}.search input::placeholder{color:#b8aecb}.main{padding:17px 13px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 2px 15px}.heading h2{font-size:22px;margin:0;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted);margin-top:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.avatar{width:43px;height:43px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800;font-size:17px;background:linear-gradient(135deg,#b49afa,#7040d5);object-fit:cover}.post-image{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin:12px 0}.upload-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 11px;border-radius:11px;background:var(--pale);color:var(--purple);font-size:12px;font-weight:750}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.toggle{width:48px;height:28px;border-radius:20px;background:#b9b3c7;position:relative;flex-shrink:0}.toggle:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:white;border-radius:50%;transition:.2s}.toggle.on{background:var(--purple)}.toggle.on:after{left:23px}.setting-icon{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;font-size:18px;flex-shrink:0}.preview-img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--soft);margin-top:10px}.name{font-size:14px;font-weight:750}.muted{font-size:12px;color:var(--muted);margin-top:3px}.btn{background:var(--purple);color:white;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px}.btn.secondary{background:var(--pale);color:var(--purple)}.btn.ghost{background:transparent;color:var(--muted);padding:8px}.btn.small{padding:8px 11px}.composer{display:flex;gap:10px;align-items:center}.composer input{width:100%;border:0;outline:0;background:var(--soft);color:var(--ink);border-radius:12px;padding:13px}.posttext{font-size:15px;line-height:1.55;white-space:pre-wrap;margin:15px 0}.postfoot{border-top:1px solid var(--line);padding-top:11px;display:flex;justify-content:space-between;gap:8px}.action{background:transparent;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;padding:6px 4px}.action.liked{color:var(--pink);font-weight:750}.comment-list{background:#f7f5fb;border-radius:12px;padding:10px;margin-top:12px;font-size:13px}.comment{padding:5px 0;line-height:1.45}.comment b{margin-right:5px}.commentform{display:flex;gap:7px;margin-top:9px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);outline-color:#b69bf5}.textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--card);color:var(--ink);outline-color:#b69bf5;line-height:1.5}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffefaed;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5;display:flex;justify-content:center;padding:8px max(7px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}.nav{width:100%;max-width:740px;display:flex;justify-content:space-around;gap:2px}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;color:#898197;padding:5px 1px;border-radius:11px;font-size:10px}.nav button.active{color:var(--purple);background:#f0eaff;font-weight:800}.nav .ico{font-size:20px;line-height:1.1}.profile-cover{height:135px;background:var(--cover,linear-gradient(120deg,#44217f,#895be8,#e2b8fa));background-size:cover;background-position:center;border-radius:15px 15px 0 0;position:relative}.profile-cover .cover-label{position:absolute;right:10px;bottom:10px;background:#171327bb;color:white;padding:7px 10px;border-radius:10px;font-size:11px}.profilebody{padding:0 15px 16px}.profileavatar{width:75px;height:75px;border:4px solid var(--card);margin-top:-36px;font-size:28px;object-fit:cover}.stats{display:flex;gap:24px;margin:17px 0}.stats b{font-size:18px;display:block}.stats span{font-size:12px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:8px 12px;border:1px solid var(--line);background:white;border-radius:30px;color:var(--muted);font-size:12px}.chip.active{background:var(--pale);border-color:#d8c9ff;color:var(--purple);font-weight:750}.notice{background:#eee8ff;color:#5b35a7;padding:11px 13px;border-radius:12px;margin-bottom:12px;font-size:13px}.empty{text-align:center;padding:28px 15px;color:var(--muted)}.empty .big{font-size:34px;margin-bottom:8px}.hidden{display:none!important}.message{max-width:85%;padding:11px 13px;border-radius:14px;margin:8px 0;font-size:14px;line-height:1.4}.message.them{background:#f0ecf8;border-bottom-left-radius:4px}.message.me{margin-left:auto;background:var(--purple);color:white;border-bottom-right-radius:4px}.storyrow{display:flex;gap:13px;overflow:auto;padding:3px 0 14px}.story{min-width:62px;text-align:center;font-size:11px;color:var(--muted)}.storyring{margin:0 auto 6px;width:57px;height:57px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff82b4,#8b5cf6,#5da6ff)}.storyring span{width:100%;height:100%;border:2px solid white;border-radius:50%;display:grid;place-items:center;background:#ded1ff;color:#6540b0;font-size:18px;font-weight:800}.sectionlabel{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin:16px 2px 9px}
@media(min-width:600px){.main{padding:22px}.top{padding:22px}.card{padding:18px}.nav button{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">M</div><div><h1>MyPage</h1><div class="tagline">Ton univers, tes connexions. ✨</div></div><button id="bell" class="btn ghost" style="margin-left:auto;color:white;font-size:20px" aria-label="Notifications">♧</button><button id="settings" class="btn ghost" style="color:white;font-size:20px" aria-label="Paramètres">⚙</button></div>
 <div class="search"><span>⌕</span><input id="search" placeholder="Rechercher des personnes, des idées..." aria-label="Rechercher"></div>
</header>
<main class="main" id="main"></main>
<nav class="bottom"><div class="nav">
 <button data-tab="Accueil" class="active"><span class="ico">⌂</span>Accueil</button>
 <button data-tab="Découvrir"><span class="ico">⌕</span>Découvrir</button>
 <button data-tab="Créer"><span class="ico">⊕</span>Créer</button>
 <button data-tab="Messages"><span class="ico">▤</span>Messages</button>
 <button data-tab="Profil"><span class="ico">◉</span>Profil</button>
</div></nav>
</div>
<script>
const $=s=>document.querySelector(s);
const defaultPosts=[
{id:1,name:"Maya Johnson",handle:"@maya.j",avatar:"M",color:"#b06be8",time:"12 min",text:"Les petites choses font parfois les plus beaux souvenirs. ✨",tag:"Lifestyle",likes:24,liked:false,comments:[{name:"Alex",text:"Tellement vrai ❤️"}],following:true},
{id:2,name:"Alex Morgan",handle:"@alexm",avatar:"A",color:"#4f91df",time:"35 min",text:"Nouveau jour, nouvelles idées. On construit quelque chose de beau, un pas à la fois. 🚀",tag:"Inspiration",likes:18,liked:false,comments:[],following:true},
{id:3,name:"Sarah Lee",handle:"@sarahlee",avatar:"S",color:"#e875ad",time:"1 h",text:"Petit rappel : tu n'as pas besoin d'être parfait pour commencer. 💜",tag:"Bien-être",likes:52,liked:false,comments:[{name:"Maya",text:"J'avais besoin de lire ça !"}],following:false}
];
let posts=load('mypage_posts',defaultPosts),profile=load('mypage_profile',{name:'Louange',bio:'Je crée mon propre univers. ✨',photo:'',cover:''}),messages=load('mypage_messages',[{from:'them',text:'Bienvenue sur MyPage ! 💜'}]),saved=load('mypage_saved',[]),settings=load('mypage_settings',{dark:false,private:false,chronological:true}),tab='Accueil',filter='Tout',notice='';
if(settings.dark)document.body.classList.add('dark');
function load(k,d){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function persist(){localStorage.setItem('mypage_posts',JSON.stringify(posts));localStorage.setItem('mypage_profile',JSON.stringify(profile));localStorage.setItem('mypage_messages',JSON.stringify(messages));localStorage.setItem('mypage_saved',JSON.stringify(saved))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatar(name,color){return profile.name===name&&profile.photo?`<img class="avatar" src="${profile.photo}" alt="Photo de profil">`:`<div class="avatar" style="background:${color||'#8150db'}">${esc((name||'?').slice(0,1).toUpperCase())}</div>`}
function heading(title,sub=''){return `<div class="heading"><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`}
function postCard(p){return `<article class="card"><div class="row">${avatar(p.avatar,p.color)}<div class="grow"><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.handle||'@membre')} · ${esc(p.time||'À l’instant')}</div></div>${p.name!==profile.name?`<button class="btn ${p.following?'secondary':''} small" onclick="follow(${p.id})">${p.following?'Suivi':'Suivre'}</button>`:''}<button class="btn ghost" aria-label="Enregistrer" onclick="savePost(${p.id})" title="Enregistrer">${saved.includes(p.id)?'🔖':'♧'}</button></div><div class="posttext">${esc(p.text)}</div>${p.image?`<img class="post-image" src="${p.image}" alt="Photo partagée par ${esc(p.name)}">`:``}<div class="muted" style="margin:0 0 12px"><span class="chip" style="display:inline-block;padding:5px 9px">${esc(p.tag||'Publication')}</span></div><div class="postfoot"><button class="action ${p.liked?'liked':''}" onclick="like(${p.id})">${p.liked?'♥':'♡'} ${p.likes} J’aime</button><button class="action" onclick="toggleComments(${p.id})">☏ ${p.comments.length} commentaires</button><button class="action" onclick="sharePost(${p.id})">↗ Partager</button></div><div id="comments-${p.id}" class="${p.showComments?'':'hidden'}">${p.comments.length?`<div class="comment-list">${p.comments.map(c=>`<div class="comment"><b>${esc(c.name)}</b>${esc(c.text)}</div>`).join('')}</div>`:''}<form class="commentform" onsubmit="comment(event,${p.id})"><input class="field" name="comment" placeholder="Écrire un commentaire..." required maxlength="500"><button class="btn">Envoyer</button></form></div></article>`}
function render(){

function toggleSetting(key){settings[key]=!settings[key];if(key==='dark')document.body.classList.toggle('dark',settings.dark);persist();render()}
function optimizeImage(file,callback){if(!file.type.startsWith('image/')){notice='Choisis un fichier image.';render();return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1400/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);callback(canvas.toDataURL('image/jpeg',0.78))};img.onerror=()=>{notice='Impossible de lire cette image.';render()};img.src=reader.result};reader.onerror=()=>{notice='Impossible de lire ce fichier.';render()};reader.readAsDataURL(file)}
function uploadProfileImage(e,kind){let file=e.target.files&&e.target.files[0];if(!file)return;if(file.size>12*1024*1024){notice='Cette image dépasse 12 Mo. Choisis une image plus légère.';render();return}optimizeImage(file,data=>{profile[kind]=data;persist();notice=kind==='photo'?'Photo de profil mise à jour.':'Photo de couverture mise à jour.';render()})}
let pendingPostImage='';
function previewPostPhoto(e){let file=e.target.files&&e.target.files[0];if(!file)return;if(file.size>12*1024*1024){notice='Cette image dépasse 12 Mo. Choisis une image de moins de 12 Mo.';render();return}optimizeImage(file,data=>{pendingPostImage=data;let el=$('#photoPreview');if(el)el.innerHTML=`<img class="preview-img" src="${pendingPostImage}" alt="Aperçu de la photo">`;})}
function resetDemo(){if(!confirm('Effacer les publications, messages, photos et préférences enregistrés sur cet appareil ?'))return;localStorage.removeItem('mypage_posts');localStorage.removeItem('mypage_profile');localStorage.removeItem('mypage_messages');localStorage.removeItem('mypage_saved');localStorage.removeItem('mypage_settings');posts=JSON.parse(JSON.stringify(defaultPosts));profile={name:'Louange',bio:'Je crée mon propre univers. ✨',photo:'',cover:''};messages=[{from:'them',text:'Bienvenue sur MyPage ! 💜'}];saved=[];settings={dark:false,private:false,chronological:true};pendingPostImage='';document.body.classList.remove('dark');tab='Accueil';notice='La démo a été réinitialisée.';render()}

document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
let main=$('#main'),q=$('#search').value.trim().toLowerCase(),out='';
if(notice)out+=`<div class="notice" onclick="notice='';render()">${esc(notice)}　✕</div>`;
if(tab==='Accueil'){
out+=heading('Ton fil d’actualité','Les idées et les personnes que tu suis.');
out+=`<div class="card"><div class="composer">${avatar(profile.name)}<input readonly onclick="go('Créer')" placeholder="Quoi de neuf, ${esc(profile.name)} ?"><button class="btn" onclick="go('Créer')">Publier</button></div></div>`;
out+=`<div class="storyrow">${[['L','Louange'],['M','Maya'],['A','Alex'],['S','Sarah'],['J','Jordan']].map((x,i)=>`<div class="story"><div class="storyring"><span>${x[0]}</span></div>${x[1]}</div>`).join('')}</div>`;
let list=posts.filter(p=>!q||`${p.name} ${p.text} ${p.tag}`.toLowerCase().includes(q));
out+=list.length?list.map(postCard).join(''):`<div class="card empty"><div class="big">⌕</div>Aucun résultat trouvé.</div>`;
}else if(tab==='Découvrir'){
out+=heading('Découvrir 🌍','Des idées, des communautés et de nouvelles personnes.');
out+=`<div class="chips">${['Tout','Lifestyle','Inspiration','Bien-être'].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div>`;
let list=posts.filter(p=>(filter==='Tout'||p.tag===filter)&&(!q||`${p.name} ${p.text} ${p.tag}`.toLowerCase().includes(q)));
out+=list.length?list.map(postCard).join(''):`<div class="card empty"><div class="big">⌕</div>Aucune publication ne correspond à ta recherche.</div>`;
}else if(tab==='Créer'){
out+=heading('Créer une publication ✨','Partage une idée, une humeur ou un moment.');
out+=`<form class="card" onsubmit="publish(event)"><div class="row" style="margin-bottom:15px">${avatar(profile.name)}<div><div class="name">${esc(profile.name)}</div><div class="muted">Partager avec la communauté</div></div></div><textarea id="draft" class="textarea" maxlength="3000" placeholder="Qu’as-tu envie de partager aujourd’hui ?" required></textarea><div class="row" style="flex-wrap:wrap;margin-top:12px"><label class="upload-btn">📷 Ajouter une photo<input id="postPhoto" type="file" accept="image/*" hidden onchange="previewPostPhoto(event)"></label><span class="muted">JPG, PNG ou image de ta galerie</span></div><div id="photoPreview"></div><div class="row" style="justify-content:space-between;margin-top:13px"><span class="muted">Respect, créativité et authenticité 💜</span><button class="btn">Publier ↗</button></div></form>`;
out+=`<div class="sectionlabel">Besoin d’inspiration ?</div><div class="card"><button class="action" onclick="useIdea('☀️ Une pensée positive pour commencer la journée.')">☀️ Partager une pensée positive</button><button class="action" onclick="useIdea('🎯 Mon objectif cette semaine : avancer un peu chaque jour.')">🎯 Parler d’un objectif</button><button class="action" onclick="useIdea('🎧 Quelle musique vous met de bonne humeur en ce moment ?')">🎧 Poser une question</button></div>`;
}else if(tab==='Messages'){
out+=heading('Messages 💬','Tes conversations dans cette démo.');
out+=`<div class="card"><div class="row">${avatar('MyPage','#5795e4')}<div><div class="name">MyPage Assistant</div><div class="muted">Conversation de démonstration</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0">`;
out+=messages.map(m=>`<div class="message ${m.from==='me'?'me':'them'}">${esc(m.text)}</div>`).join('');
out+=`<form class="commentform" onsubmit="sendMessage(event)"><input class="field" name="message" placeholder="Écrire un message..." required maxlength="1000"><button class="btn">➤</button></form><p class="muted">Les messages restent sur cet appareil. Aucun autre utilisateur ne les reçoit.</p></div>`;
}else if(tab==='Profil'){
out+=heading('Mon profil','Ton espace, tes règles.');
out+=`<div class="card" style="padding:0;overflow:hidden"><div class="profile-cover" style="${profile.cover?`background-image:url(\'${profile.cover}\')`:``}"><label class="cover-label">📷 Changer la couverture<input type="file" accept="image/*" hidden onchange="uploadProfileImage(event,\'cover\')"></label></div><div class="profilebody"><div class="row" style="align-items:end;justify-content:space-between">${profile.photo?`<img class="avatar profileavatar" src="${profile.photo}" alt="Photo de profil">`:avatar(profile.name)}<button class="btn secondary" onclick="toggleEdit()">✎ Modifier le profil</button></div><label class="upload-btn" style="margin-top:10px">📷 Changer la photo de profil<input type="file" accept="image/*" hidden onchange="uploadProfileImage(event,\'photo\')"></label><h2 style="margin:10px 0 3px">${esc(profile.name)}</h2><div class="muted">@louange</div><p style="line-height:1.5">${esc(profile.bio)}</p><div class="stats"><div><b>${posts.filter(p=>p.name===profile.name).length}</b><span>Publications</span></div><div><b>${posts.filter(p=>p.following).length}</b><span>Profils suivis*</span></div><div><b>${saved.length}</b><span>Enregistrés</span></div></div><div id="editform" class="hidden"><form onsubmit="updateProfile(event)"><label class="muted">Nom affiché</label><input class="field" name="name" value="${esc(profile.name)}" required maxlength="40" style="margin:6px 0 12px"><label class="muted">Biographie</label><textarea class="textarea" name="bio" maxlength="180" style="min-height:80px;margin:6px 0 12px">${esc(profile.bio)}</textarea><button class="btn">Enregistrer</button></form></div></div></div>`;
out+=`<div class="sectionlabel">Mes publications</div>`;
let own=posts.filter(p=>p.name===profile.name);
out+=own.length?own.map(postCard).join(''):`<div class="card empty"><div class="big">✎</div>Tu n’as pas encore publié.<br><button class="btn" style="margin-top:14px" onclick="go('Créer')">Créer ma première publication</button></div>`;
out+=`<div class="muted" style="padding:8px">*Statistiques de démonstration.</div>`;
}else if(tab==='Paramètres'){
out+=heading('Paramètres ⚙️','Personnalise MyPage à ta façon.');
out+=`<div class="card"><div class="sectionlabel" style="margin-top:0">Apparence</div>
<div class="settings-row"><div class="row"><div class="setting-icon">🌙</div><div><div class="name">Mode sombre</div><div class="muted">Une interface plus douce dans l’obscurité</div></div></div><button class="toggle ${settings.dark?'on':''}" role="switch" aria-checked="${settings.dark}" aria-label="Mode sombre" onclick="toggleSetting('dark')"></button></div>
<div class="settings-row"><div class="row"><div class="setting-icon">🕒</div><div><div class="name">Fil chronologique</div><div class="muted">Afficher les publications les plus récentes en premier</div></div></div><button class="toggle ${settings.chronological?'on':''}" role="switch" aria-checked="${settings.chronological}" aria-label="Fil chronologique" onclick="toggleSetting('chronological')"></button></div></div>
<div class="card"><div class="sectionlabel" style="margin-top:0">Confidentialité</div><div class="settings-row"><div class="row"><div class="setting-icon">🔒</div><div><div class="name">Profil privé</div><div class="muted">Réglage de démonstration : les publications ne sont pas réellement privées sans serveur.</div></div></div><button class="toggle ${settings.private?'on':''}" role="switch" aria-checked="${settings.private}" aria-label="Profil privé" onclick="toggleSetting('private')"></button></div></div>
<div class="card"><div class="sectionlabel" style="margin-top:0">Ton compte</div><div class="settings-row"><div class="row"><div class="setting-icon">🖼️</div><div><div class="name">Personnaliser le profil</div><div class="muted">Nom, biographie, photo et couverture</div></div></div><button class="btn secondary small" onclick="go('Profil')">Modifier</button></div><div class="settings-row"><div class="row"><div class="setting-icon">🔖</div><div><div class="name">Publications enregistrées</div><div class="muted">${saved.length} élément(s) sauvegardé(s)</div></div></div><button class="btn secondary small" onclick="go('Enregistrés')">Voir</button></div><div class="settings-row"><div class="row"><div class="setting-icon">🧹</div><div><div class="name">Réinitialiser la démo</div><div class="muted">Effacer les données locales de MyPage</div></div></div><button class="btn small" style="background:#b83260" onclick="resetDemo()">Réinitialiser</button></div></div>
<div class="muted" style="padding:8px">MyPage — prototype local. Les préférences sont enregistrées sur cet appareil.</div>`;
}else if(tab==='Enregistrés'){
out+=heading('Enregistrés 🔖','Les publications que tu veux retrouver.');
let list=posts.filter(p=>saved.includes(p.id));
out+=list.length?list.map(postCard).join(''):`<div class="card empty"><div class="big">🔖</div>Aucune publication enregistrée pour le moment.</div>`;
}else if(tab==='Notifications'){
out+=heading('Notifications ♧','Les nouveautés de ton espace.');
out+=`<div class="card"><div class="row" style="align-items:start">${avatar('♥','#e84c91')}<div><div class="name">La communauté t’attend</div><div class="sub">Publie quelque chose pour commencer à recevoir des réactions.</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="row" style="align-items:start">${avatar('✦','#7545d6')}<div><div class="name">Découvre de nouvelles personnes</div><div class="sub">Explore les publications et commence à suivre des profils.</div></div></div></div>`;
}
main.innerHTML=out;
}
function go(t){tab=t;notice='';render();window.scrollTo({top:0,behavior:'smooth'})}
function like(id){posts=posts.map(p=>p.id===id?{...p,liked:!p.liked,likes:p.likes+(p.liked?-1:1)}:p);persist();render()}
function follow(id){posts=posts.map(p=>p.id===id?{...p,following:!p.following}:p);persist();render()}
function savePost(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();notice=saved.includes(id)?'Publication enregistrée.':'Publication retirée des favoris.';render()}
function toggleComments(id){posts=posts.map(p=>p.id===id?{...p,showComments:!p.showComments}:p);render()}
function comment(e,id){e.preventDefault();let text=new FormData(e.target).get('comment').trim();if(!text)return;posts=posts.map(p=>p.id===id?{...p,comments:[...p.comments,{name:profile.name,text}],showComments:true}:p);persist();render()}
function publish(e){e.preventDefault();let text=$('#draft').value.trim();if(!text)return;posts.unshift({id:Date.now(),name:profile.name,handle:'@louange',avatar:profile.name[0].toUpperCase(),color:'#8150db',time:'À l’instant',text,image:pendingPostImage,tag:'Ma publication',likes:0,liked:false,comments:[],following:true});pendingPostImage='';persist();tab='Accueil';notice='Ta publication a été ajoutée au fil !';render();window.scrollTo({top:0,behavior:'smooth'})}
function setFilter(x){filter=x;render()}
function useIdea(t){go('Créer');setTimeout(()=>{$('#draft').value=t;$('#draft').focus()},0)}
function toggleEdit(){let el=$('#editform');if(el)el.classList.toggle('hidden')}
function updateProfile(e){e.preventDefault();let f=new FormData(e.target);let old=profile.name;profile={name:f.get('name').trim(),bio:f.get('bio').trim()};posts=posts.map(p=>p.name===old?{...p,name:profile.name,avatar:profile.name[0].toUpperCase()}:p);persist();notice='Profil mis à jour.';render()}
function sendMessage(e){e.preventDefault();let text=new FormData(e.target).get('message').trim();if(!text)return;messages.push({from:'me',text});persist();render()}
function sharePost(id){let p=posts.find(x=>x.id===id);if(navigator.share){navigator.share({title:'MyPage',text:p.text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(p.text).then(()=>{notice='Texte de la publication copié.';render()}).catch(()=>{notice='Tu peux copier le texte de la publication.';render()})}else{notice='Publication sélectionnée.';render()}}

function toggleSetting(key){settings[key]=!settings[key];if(key==='dark')document.body.classList.toggle('dark',settings.dark);persist();render()}
function optimizeImage(file,callback){if(!file.type.startsWith('image/')){notice='Choisis un fichier image.';render();return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1400/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);callback(canvas.toDataURL('image/jpeg',0.78))};img.onerror=()=>{notice='Impossible de lire cette image.';render()};img.src=reader.result};reader.onerror=()=>{notice='Impossible de lire ce fichier.';render()};reader.readAsDataURL(file)}
function uploadProfileImage(e,kind){let file=e.target.files&&e.target.files[0];if(!file)return;if(file.size>12*1024*1024){notice='Cette image dépasse 12 Mo. Choisis une image plus légère.';render();return}optimizeImage(file,data=>{profile[kind]=data;persist();notice=kind==='photo'?'Photo de profil mise à jour.':'Photo de couverture mise à jour.';render()})}
let pendingPostImage='';
function previewPostPhoto(e){let file=e.target.files&&e.target.files[0];if(!file)return;if(file.size>12*1024*1024){notice='Cette image dépasse 12 Mo. Choisis une image de moins de 12 Mo.';render();return}optimizeImage(file,data=>{pendingPostImage=data;let el=$('#photoPreview');if(el)el.innerHTML=`<img class="preview-img" src="${pendingPostImage}" alt="Aperçu de la photo">`;})}
function resetDemo(){if(!confirm('Effacer les publications, messages, photos et préférences enregistrés sur cet appareil ?'))return;localStorage.removeItem('mypage_posts');localStorage.removeItem('mypage_profile');localStorage.removeItem('mypage_messages');localStorage.removeItem('mypage_saved');localStorage.removeItem('mypage_settings');posts=JSON.parse(JSON.stringify(defaultPosts));profile={name:'Louange',bio:'Je crée mon propre univers. ✨',photo:'',cover:''};messages=[{from:'them',text:'Bienvenue sur MyPage ! 💜'}];saved=[];settings={dark:false,private:false,chronological:true};pendingPostImage='';document.body.classList.remove('dark');tab='Accueil';notice='La démo a été réinitialisée.';render()}

document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
$('#search').addEventListener('input',()=>{if(tab!=='Accueil'&&tab!=='Découvrir')tab='Découvrir';render()});
$('#bell').addEventListener('click',()=>go('Notifications'));$('#settings').addEventListener('click',()=>go('Paramètres'));
render();
</script>
</body>
</html>
